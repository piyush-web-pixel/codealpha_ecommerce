{% load static %}
{% include 'usernav.html' %}


<style>

    <style>

/* Page Background */
body {
    background-color: #f5f7fa;
}

/* Heading */
.container h3 {
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Product Card */
.card {
    border-radius: 15px;
    overflow: hidden;
    transition: all 0.35s ease;
    background: #fff;
}

/* Hover Effect */
.card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

/* Image */
.card-img-top {
    height: 220px;
    object-fit: cover;
    transition: 0.4s;
}

/* Image Zoom */
.card:hover .card-img-top {
    transform: scale(1.08);
}

/* Title */
.card-title {
    font-size: 17px;
    font-weight: 600;
    color: #222;
}

/* Price */
.text-success {
    font-size: 20px;
    font-weight: bold;
    color: #28a745 !important;
}

/* Buttons */
.btn {
    border-radius: 25px;
    padding: 6px 18px;
    font-size: 13px;
    transition: 0.3s;
}

/* View Button */
.btn-outline-primary {
    border: 1px solid #0d6efd;
}

.btn-outline-primary:hover {
    background: #0d6efd;
    color: white;
}

/* Add to Cart Button */
.btn-primary {
    background: linear-gradient(135deg, #0d6efd, #4dabf7);
    border: none;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #0b5ed7, #339af0);
}

/* No Data Section */
.text-center img {
    opacity: 0.7;
}

.text-center h4 {
    font-weight: 600;
    color: #444;
}

/* Responsive */
@media (max-width: 768px) {
    .card-img-top {
        height: 160px;
    }
}

</style>


<div class="container mt-5">

  <!-- 🔍 Heading -->
  <h3 class="mb-4">
    Search Results for "<span class="text-primary">{{ query }}</span>"
  </h3>

  {% if products %}

    <div class="row">

      {% for product in products %}
      <div class="col-md-3 col-sm-6 mb-4">

        <div class="card h-100 shadow-sm border-0">

          <!-- Product Image -->
          <img src="{{ product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">

          <div class="card-body text-center">

            <!-- Product Name -->
            <h5 class="card-title">{{ product.pname }}</h5>

            <!-- Price -->
            <p class="text-success fw-bold">₹{{ product.prize }}</p>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-2">

              <a href="{% url 'detail' product.slug %}" class="btn btn-outline-primary btn-sm">
                View
              </a>

              <button onclick="addToCart({{ product.id }})" class="btn btn-primary btn-sm">
                Add to Cart
              </button>

            </div>

          </div>

        </div>

      </div>
      {% endfor %}

    </div>

  {% else %}

    <!-- ❌ No Results UI -->
    <div class="text-center mt-5">
      <img src="{% static 'images/no-data.png' %}" width="200" class="mb-3">
      <h4>No products found 😢</h4>
      <p>Try searching with different keywords.</p>
      <a href="/userhome/" class="btn btn-primary mt-2">Go Shopping</a>
    </div>

  {% endif %}

</div>
